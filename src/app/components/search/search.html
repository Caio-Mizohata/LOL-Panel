<div class="w-full rounded-xl border bg-card p-4 text-card-foreground">
  <h2 id="search-title" class="font-semibold">Buscar jogador</h2>
  <p class="mt-1 text-sm text-muted-foreground">
    Informe o Riot ID de uma conta do servidor brasileiro.
  </p>
  <form
    class="mt-4 space-y-3"
    aria-labelledby="search-title"
    (submit)="$event.preventDefault(); searchRequested.emit({ gameName: gameName.value, tagLine: tagLine.value })"
  >
    <div class="grid grid-cols-[minmax(0,1fr)_5rem] gap-3">
      <div>
        <label for="game-name" class="text-sm font-medium">Nome do jogador</label>
        <input
          #gameName
          id="game-name"
          name="gameName"
          required
          maxlength="100"
          class="mt-1 h-9 w-full rounded-md border border-input bg-background px-3 text-sm outline-none focus-visible:ring-2 focus-visible:ring-ring"
        />
      </div>
      <div>
        <label for="tag-line" class="text-sm font-medium">Tag</label>
        <input
          #tagLine
          id="tag-line"
          name="tagLine"
          required
          maxlength="20"
          class="mt-1 h-9 w-full rounded-md border border-input bg-background px-3 text-sm outline-none focus-visible:ring-2 focus-visible:ring-ring"
        />
      </div>
    </div>
    <button hlmBtn type="submit" class="w-full" [disabled]="loading()">
      {{ loading() ? 'Buscando…' : 'Buscar perfil' }}
    </button>
  </form>
</div>
