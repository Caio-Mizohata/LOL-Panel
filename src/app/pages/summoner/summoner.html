<section
  class="mx-auto flex min-h-[calc(100vh-10rem)] w-full max-w-6xl flex-col items-center px-4 py-8 sm:px-6 lg:px-8"
  aria-labelledby="search-title"
>
  <div class="w-full max-w-2xl">
    <h1 id="search-title" class="text-center text-2xl font-bold sm:text-3xl">Buscar jogador</h1>
    <p class="mt-2 text-center text-sm text-muted-foreground sm:text-base">
      Digite o nome do jogador e a tagline para consultar um perfil.
    </p>

    <form
      class="mt-6 flex w-full flex-col gap-3 sm:flex-row"
      (submit)="$event.preventDefault(); searchPlayer(gameName.value, tagLine.value)"
    >
      <div class="grid min-w-0 flex-1 grid-cols-[minmax(0,1fr)_6rem] gap-3">
        <div>
          <label for="game-name" class="sr-only">Nome do jogador</label>
          <input
            #gameName
            id="game-name"
            name="gameName"
            type="search"
            required
            maxlength="100"
            autocomplete="off"
            placeholder="Nome do jogador"
            [value]="searchedGameName()"
            class="h-11 w-full rounded-md border border-input bg-background px-4 text-sm outline-none transition-shadow placeholder:text-muted-foreground focus-visible:ring-2 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-60"
            [disabled]="loading()"
          />
        </div>
        <div>
          <label for="tag-line" class="sr-only">Tagline</label>
          <input
            #tagLine
            id="tag-line"
            name="tagLine"
            type="search"
            required
            maxlength="20"
            autocomplete="off"
            placeholder="BR1"
            [value]="searchedTagLine()"
            aria-describedby="riot-id-hint"
            class="h-11 w-full rounded-md border border-input bg-background px-3 text-sm outline-none transition-shadow placeholder:text-muted-foreground focus-visible:ring-2 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-60"
            [disabled]="loading()"
          />
        </div>
      </div>
      <button
        type="submit"
        class="inline-flex h-11 items-center justify-center rounded-md bg-primary px-6 text-sm font-semibold text-primary-foreground transition-opacity hover:opacity-90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="loading()"
      >
        {{ loading() ? 'Buscando…' : 'Buscar perfil' }}
      </button>
    </form>
    <p id="riot-id-hint" class="mt-2 text-xs text-muted-foreground">
      Exemplo: Nome do jogador &nbsp; BR1
    </p>
  </div>

  <div class="mt-8 flex w-full justify-center" aria-live="polite">
    @if (loading()) {
      <div
        class="flex min-h-48 w-full max-w-md flex-col items-center justify-center gap-3 rounded-3xl border-2 border-dashed border-muted bg-muted/10 p-8 text-center"
      >
        <div
          class="size-8 animate-spin rounded-full border-4 border-primary border-t-transparent"
        ></div>
        <p class="text-sm font-medium text-muted-foreground">Carregando perfil…</p>
      </div>
    } @else if (error(); as errorMessage) {
      <div
        class="w-full max-w-md rounded-2xl border border-destructive/40 bg-destructive/10 p-5 text-center"
        role="alert"
      >
        <p class="font-semibold text-destructive">Não foi possível buscar o jogador</p>
        <p class="mt-1 text-sm text-muted-foreground">{{ errorMessage }}</p>
      </div>
    } @else if (profile(); as player) {
      <app-cards [profile]="player" [priority]="true" class="w-full max-w-md" />
    }
  </div>
</section>
