<header class="sticky top-0 z-50 w-full border-b border-border bg-[oklch(0.21_0.01_286)] text-foreground">
    <div class="mx-auto flex h-14 w-full max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">

        <!-- Lado Esquerdo: Logo -->
        <div class="flex items-center gap-2 shrink-0">
            <a routerLink="/" class="flex items-center gap-2 transition-opacity hover:opacity-80">
                <h1 class="text-xl font-bold tracking-tight">LOL Panel</h1>
            </a>
        </div>

        <!-- Lado Direito: Navegação Spartan -->
        <div class="flex items-center justify-end gap-2">
            <nav hlmNavigationMenu>
                <ul hlmNavigationMenuList class="flex items-center gap-1">
                    <li hlmNavigationMenuItem>
                        <button hlmNavigationMenuTrigger align="center" class="bg-[oklch(0.21_0.01_286)]">Jogadores</button>
                        <hlm-navigation-menu-content *hlmNavigationMenuPortal>
                            <ul class="w-72 sm:w-80 max-w-[calc(100vw-2rem)] flex flex-col gap-1 p-2">
                                @for (component of _components; track $index) {
                                    <li>
                                        <a hlmNavigationMenuLink [routerLink]="component.href" class="block select-none space-y-1 rounded-md p-3 leading-none no-underline outline-none transition-colors hover:bg-accent hover:text-accent-foreground focus:bg-accent focus:text-accent-foreground">
                                            <div class="flex flex-col gap-1 text-sm">
                                                <div class="leading-none font-medium">{{ component.title }}</div>
                                                <div class="text-muted-foreground line-clamp-2 text-xs">{{ component.description }}</div>
                                            </div>
                                        </a>
                                    </li>
                                }
                            </ul>
                        </hlm-navigation-menu-content>
                    </li>
                    <!-- <li hlmNavigationMenuItem>
                        <a hlmNavigationMenuLink routerLink="/documentation/introduction">Docs</a>
                    </li> -->
                </ul>
            </nav>
        </div>

    </div>
</header>
